<style>
:root{
  --bg:#f7e9de; --surface:#fff6ef; --ink:#4a2f1f; --muted:#8a6a58; --line:#e8cfc0;
  --pink:#c98f85; --on-pink:#4a2f1f; --accent:#a4574b; --focus:#4a2f1f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#4a3020; --surface:#583a27; --ink:#f3dfcf; --muted:#cdb09d; --line:#6e4e3a; --pink:#d9a198; --on-pink:#3b271a; --accent:#e8b3a9; --focus:#f3dfcf;}
}
:root[data-theme="dark"]{--bg:#4a3020; --surface:#583a27; --ink:#f3dfcf; --muted:#cdb09d; --line:#6e4e3a; --pink:#d9a198; --on-pink:#3b271a; --accent:#e8b3a9; --focus:#f3dfcf;}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;line-height:1.6;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{display:flex;align-items:center;gap:16px;padding:24px 20px 12px;max-width:640px;margin:0 auto}
header img{width:84px;height:84px;border-radius:22px;flex:none}
header p{margin:0;font-family:"Playfair Display","Noto Kufi Arabic",serif;font-size:1.35rem;color:var(--accent);line-height:1.4}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;max-width:640px;margin:0 auto}
.tab{flex:none;border:1.5px solid var(--pink);background:transparent;color:var(--ink);font:inherit;padding:6px 16px;border-radius:99px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--pink);color:var(--on-pink);font-weight:700}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:0 20px}
section h2{font-family:"Playfair Display","Noto Kufi Arabic",serif;font-size:1.5rem;margin:28px 0 4px;color:var(--accent)}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px dashed var(--line)}
.info{min-width:0}
.name{font-weight:700;font-size:1.1rem}
.desc{color:var(--muted);font-size:.92rem}
.price{color:var(--accent);font-weight:700;margin-top:2px}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.ctl button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:1.3rem;line-height:1;cursor:pointer}
.ctl button.add{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.ctl .q{min-width:18px;text-align:center;font-weight:700}
#bar{position:fixed;inset:auto 0 0 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:11;pointer-events:none}
#bar button{pointer-events:auto;display:flex;justify-content:space-between;width:100%;max-width:608px;margin:0 auto;background:var(--pink);color:var(--on-pink);border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#bar[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(40,24,14,.55);display:none;align-items:flex-end}
#sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.panel h3{font-family:"Playfair Display","Noto Kufi Arabic",serif;margin:0 0 8px;font-size:1.4rem;color:var(--accent)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.total{font-weight:700;font-size:1.2rem;margin:14px 0}
.actions{display:flex;gap:10px}
.actions button{flex:1;padding:12px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
.actions .go{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.done{text-align:center;padding:12px 0}
#app[hidden]{display:none}
.ico{width:54px;height:54px;flex:none;transition:transform .25s}
.ico:hover{transform:rotate(-6deg) scale(1.06)}
.ico svg,.hico svg{width:100%;height:100%;overflow:visible}
.ico.pop{animation:pop2 .45s ease-out}
section h2{display:flex;align-items:center;gap:10px}
.hico{width:42px;height:42px;flex:none}
.sp,.sp2{animation:spin 20s linear infinite}
.sp{transform-origin:120px 120px}
.sp2{transform-origin:32px 32px}
.bob{animation:bob 3.2s ease-in-out infinite}
.steam{opacity:0;animation:steam 2.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-9px)}}
@keyframes pop2{40%{transform:scale(1.3) rotate(-8deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.sp,.sp2,.bob,.ico.pop{animation:none}.steam{animation:none;opacity:.7}}
.enter section h2{--fx:0px;--r:0deg;animation:gather .6s cubic-bezier(.2,.9,.25,1.1) both}
.enter .item{animation:gather .65s cubic-bezier(.2,.9,.25,1.1) both;animation-delay:calc(var(--i,0)*85ms)}
.enter .item:nth-child(odd){--fx:70px;--r:10deg}
.enter .item:nth-child(even){--fx:-70px;--r:-10deg}
.enter .ico svg{animation:gico .8s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i,0)*85ms + .15s)}
.enter .ico svg path[stroke-linecap="round"]:not(.sp2){stroke-dasharray:60;animation:draw .9s ease-out both;animation-delay:calc(var(--i,0)*85ms + .55s)}
#app:not([hidden]) header img{animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
#app:not([hidden]) header p{animation:fade .8s .25s both}
@keyframes gather{from{opacity:0;transform:translate(var(--fx,60px),34px) rotate(var(--r,10deg)) scale(.7)}to{opacity:1;transform:none}}
@keyframes gico{from{transform:scale(0) rotate(-140deg)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.6) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter section h2,.enter .item,.enter .ico svg,.enter .ico svg path,#app header img,#app header p{animation:none!important}}
body:not(.started),body:not(.started)::before{background:#583a27}
body.started #land{display:none}
#land{position:relative;min-height:100vh;min-height:100dvh;background:#583a27;color:#f7e9de;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:10px;overflow:hidden}
#land::before{content:"";position:absolute;inset:14px;border:1px solid #f7e9de;opacity:.35;pointer-events:none}
#land>*{animation:fade .8s both}
#land>:nth-child(2){animation-delay:.15s}#land>:nth-child(3){animation-delay:.3s}#land>:nth-child(4){animation-delay:.45s}#land>:nth-child(5){animation-delay:.6s}
.wm{font-family:"Playfair Display","Noto Kufi Arabic",serif;font-weight:700;font-size:clamp(2.6rem,13vw,3.8rem);line-height:1.1;direction:ltr}
.pair{display:flex;align-items:flex-end;justify-content:center;gap:4px;direction:ltr;margin:6px 0}
.pair span{display:block}.pair .a{width:min(104px,28vw)}.pair .b{width:min(80px,22vw)}.lg{width:min(260px,70vw);height:auto}
.pair svg{width:100%;height:auto;overflow:visible;animation:gico .9s cubic-bezier(.3,1.5,.5,1) .3s both}
.scr{font-family:"Great Vibes",cursive;font-size:2.3rem;line-height:1.2;color:#e8b3a9;margin:0;direction:ltr}
#start{margin-top:10px;background:#c98f85;color:#3b271a;border:0;border-radius:99px;padding:14px 46px;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer}
#start:focus-visible{outline:3px solid #f7e9de;outline-offset:3px}
#land>.hrt{color:#c98f85;font-size:1.3rem;animation:fade .8s .6s both,beat 1.6s 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.25)}}
header p{font-family:"Great Vibes",cursive;font-size:1.9rem;direction:ltr}
@media (prefers-reduced-motion:reduce){#land>*,.pair svg,.hrt{animation:none!important}}
.actions a{flex:1;padding:12px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;border:1.5px solid var(--pink);text-align:center;text-decoration:none;background:var(--pink);color:var(--on-pink)}
.note{background:var(--bg);border:1px dashed var(--pink);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:.92rem;line-height:1.7}
.pay{background:var(--bg);border-radius:12px;padding:12px;margin:0 0 10px;font-size:.95rem;line-height:1.8}
.pay .pt{font-weight:700;color:var(--accent)}
.iban{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iban span{font-weight:700;font-size:.9rem;word-break:break-all;direction:ltr;text-align:left}
.iban button{flex:none;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;padding:4px 14px;font:inherit;cursor:pointer}
.dlv{margin:0 0 10px}
.dlv .pt{font-weight:700;color:var(--accent);margin-bottom:6px}
.opts{display:flex;gap:8px;margin-bottom:8px}
.opt{flex:1;padding:9px 8px;border-radius:12px;border:1.5px solid var(--pink);background:transparent;color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--pink);color:var(--on-pink);font-weight:700}
#addr{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:6px}
.err{color:var(--accent);font-size:.9rem}
.opts{flex-wrap:wrap}
.opt{flex:1 1 30%}
header .hl{width:84px;height:84px;flex:none}
#app:not([hidden]) header .hl{animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
</style>

function renderTabs(){
  var h='<button class="tab" aria-pressed="'+(cur==="all")+'" data-t="all">الكل</button>';
  DATA.forEach(function(c){h+='<button class="tab" aria-pressed="'+(cur===c.id)+'" data-t="'+c.id+'">'+c.t+'</button>'});
  $("tabs").innerHTML=h;
}
function renderMenu(){
  var h="",n=0;
  DATA.forEach(function(c){
    if(cur!=="all"&&cur!==c.id)return;
    h+='<section><h2><span class="hico">'+icon(c.id,"")+'</span>'+c.t+'</h2>';
    c.items.forEach(function(it,i){
      var k=key(c.id,i),q=qty[k]||0;
      h+='<div class="item" style="--i:'+(n++)+'"><div class="ico" data-k="'+k+'">'+icon(c.id,it[0])+'</div><div class="info"><div class="name">'+it[0]+'</div><div class="desc">'+it[1]+'</div><div class="price">'+fmt(it[2])+'</div></div><div class="ctl">'+
      (q?'<button data-m="'+k+'" aria-label="إنقاص">−</button><span class="q">'+q+'</span>':'')+
      '<button class="add" data-p="'+k+'" aria-label="إضافة '+it[0]+'">+</button></div></div>';
    });
    h+='</section>';
  });
  $("menu").innerHTML=h;
}
function lines(){
  var out=[];
  DATA.forEach(function(c){c.items.forEach(function(it,i){var q=qty[key(c.id,i)]||0;if(q)out.push({n:it[0],q:q,p:it[2]})})});
  return out;
}
function renderBar(){
  var l=lines(),n=0,s=0;
  l.forEach(function(x){n+=x.q;s+=x.q*x.p});
  $("bar").hidden=!n;
  $("cnt").textContent="عرض الطلب ("+n+")";
  $("sum").textContent=fmt(s+fee());
}
function openSheet(){
  var l=lines(),s=0,h='<h3>طلبك</h3>';
  l.forEach(function(x){s+=x.q*x.p;h+='<div class="row"><span>'+x.q+' × '+x.n+'</span><span>'+fmt(x.q*x.p)+'</span></div>'});
  if(ship.m==="del")h+='<div class="row"><span>التوصيل ('+ZN[ship.z]+')</span><span>'+fmt(fee())+'</span></div>';
  h+='<div class="total">الإجمالي: '+fmt(s+fee())+'</div><div class="pay"><div class="pt">بيانات التحويل</div><div>اسم الحساب: الجوهره حلاف - الماضي</div><div>البنك: الراجحي</div><div>رقم الحساب: <span dir="ltr">208000010006086085987</span></div><div class="iban"><span>SA5580000208608016085987</span><button id="cp">نسخ الآيبان</button></div></div>'+dlv()+'<div class="note">ملاحظة: لا يتم اعتماد الطلب وتحضيره إلا بعد تحويل المبلغ، وإرسال صورة التحويل في الواتساب.</div><div class="actions"><button id="back">رجوع</button><a class="go" id="send" href="'+waLink()+'" target="_blank" rel="noopener">أرسل عبر واتساب</a></div>';
  $("panel").innerHTML=h;$("sheet").classList.add("open");
}
var ship={m:"pick",z:"m",a:""};
var ZN={m:"مروج ب والورود",o:"باقي الأحياء"};
function fee(){return ship.m==="del"?(ship.z==="o"?20:15):0}
function dlv(){var o=function(a,v,t,on){return '<button class="opt" '+a+'="'+v+'" aria-pressed="'+on+'">'+t+'</button>'};var h='<div class="dlv"><div class="pt">طريقة الاستلام</div><div class="opts">'+o("data-d","pick","استلام من المتجر (مجاناً)",ship.m==="pick")+o("data-d","del","توصيل",ship.m==="del")+'</div>';if(ship.m==="del")h+='<div class="opts">'+o("data-z","m","مروج ب والورود: 15 ريال",ship.z==="m")+o("data-z","o","باقي الأحياء: 20 ريال",ship.z==="o")+'</div><input id="addr" placeholder="اسم الحي والعنوان" value="'+ship.a.replace(/"/g,"&quot;")+'">';return h+'<div id="err" class="err"></div></div>'}
document.addEventListener("input",function(e){if(e.target.id==="addr")ship.a=e.target.value});
function closeSheet(){$("sheet").classList.remove("open")}
var WA="966558196035";
function waLink(){var l=lines(),s=0,p=["طلب جديد من Buni:"];l.forEach(function(x){s+=x.q*x.p;p.push("- "+x.q+" × "+x.n+" ("+fmt(x.q*x.p)+")")});p.push(ship.m==="del"?"التوصيل: "+ZN[ship.z]+" ("+fmt(fee())+") - العنوان: "+ship.a:"الاستلام: من المتجر");p.push("الإجمالي: "+fmt(s+fee()));p.push("ملاحظة: الطلب يُعتمد بعد التحويل، وسأرسل صورة التحويل هنا.");return "https://wa.me/"+WA+"?text="+p.map(encodeURIComponent).join("%0A")}
function sent(){var k=waLink();qty={};refresh();$("panel").innerHTML='<div class="done"><h3>تم تجهيز طلبك</h3><p>أكمل الإرسال من واتساب، ولا يُعتمد طلبك إلا بعد تحويل المبلغ وإرسال صورة التحويل. إذا ما انفتح واتساب، اضغط الزر.</p><div class="actions"><a class="go" href="'+k+'" target="_blank" rel="noopener">فتح واتساب</a><button id="back">إغلاق</button></div></div>'}
function enter(){var m=$("menu");m.classList.remove("enter");void m.offsetWidth;m.classList.add("enter")}
function refresh(){$("menu").classList.remove("enter");renderMenu();renderBar()}
document.addEventListener("click",function(e){
  var sa=e.target.closest("#send");if(sa){if(ship.m==="del"&&!ship.a.trim()){e.preventDefault();var er=$("err");if(er)er.textContent="اكتب اسم الحي والعنوان للتوصيل.";return}sa.href=waLink();setTimeout(sent,50);return}
  var b=e.target.closest("button,#sheet");if(!b)return;
  if(b.id==="start"){document.body.classList.add("started");$("app").hidden=false;window.scrollTo(0,0);enter();return}
  if(b.id==="sheet"){if(e.target===b)closeSheet();return}
  if(b.dataset.t){cur=b.dataset.t;renderTabs();renderMenu();enter();return}
  if(b.dataset.p){qty[b.dataset.p]=(qty[b.dataset.p]||0)+1;refresh();var ic=document.querySelector('.ico[data-k="'+b.dataset.p+'"]');if(ic)ic.classList.add("pop");return}
  if(b.dataset.m){qty[b.dataset.m]=Math.max(0,(qty[b.dataset.m]||0)-1);refresh();return}
  if(b.dataset.d){ship.m=b.dataset.d;renderBar();openSheet();return}
  if(b.dataset.z){ship.z=b.dataset.z;renderBar();openSheet();return}
  if(b.id==="cp"){var t="SA5580000208608016085987",dn=function(){b.textContent="تم النسخ"},fb=function(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");dn()}catch(x){}document.body.removeChild(a)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(dn,fb)}else{fb()}return}
  if(b.id==="open"){openSheet();return}
  if(b.id==="back"){closeSheet();return}
  if(b.id==="send"){qty={};refresh();$("panel").innerHTML='<div class="done"><h3>تم استلام طلبك</h3><p>نجهّز أصنافك الآن.</p><div class="actions"><button class="go" id="back">حسناً</button></div></div>'}
});
$("pair").innerHTML='<span class="a">'+icon("roll","")+'</span><span class="b">'+icon("cof","")+'</span>';
renderTabs();refresh();
</script>
</body>
</html>
